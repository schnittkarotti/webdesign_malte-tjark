<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilder von unseren Produkten</title>
    <style>

	body {
	background-image: url(img/istockphoto-1417433518-612x612.jpg);
    background-size: cover;
    background-attachment: fixed;
	}
	
	h1 { 
	color:rgb(92, 70, 23);
	background-color: rgb(255, 184, 52);
	font-size: 2.5em;
	border: thin solid;
	border-radius: 0 1em 1em 1em;
	padding: 0.5em;
	}		

	h2 { 
	color: rgb(92, 70, 23);
	background-color: rgb(255, 184, 52);
	font-size: 1.9em;
	border: thin solid;
	}		
	

    ul li {
    float: left;
    }

    ul li a {
    display: block;
    color: rgb(2, 2, 2);
    text-align: center;
    padding: 14px 16px;
    text-decoration: none;
    }

	a {
		color: #800000;
		font-size: 1em;
	}

	p {
		color: #8B4513;
		font-size: 1.3rem;
	}

    .dropdown {
      text-align: center;
      position: relative;
      display: inline-block;
      color: black;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .dropdown summary {
      cursor: pointer;
      list-style: none;
      user-select: none;
    }

    .dropdown summary::-webkit-details-marker {
      display: none;
    }

    .dropdown-content {
      display: block;
      background-color: #f9f9f9;
      min-width: 180px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      padding: 12px 16px;
      z-index: 10;
      white-space: nowrap;
      margin-top: 8px;
    }

    .dropdown-content img {
      display: inline-block;
      vertical-align: top;
    }
    .product-categories { 
    text-align: center; }
    
	</style>
</head>

<body>
    <h1>
        Unsere Produkte
    </h1>

    <ul>
        <li><a href="index.html">Startseite</a></li>
        <li><a href="inhalt.html">Bilder von unseren Produkten</a></li>
        <li><a href="preise.html">Unsere Preise</a></li>
    </ul>

    <p>
        Hier sehen Sie einen Überblick über unsere Angebote:
    </p>

    <div class="product-categories">
        <details class="dropdown">
            <summary>Kommoden</summary>
            <div class="dropdown-content">
                <img src="img/cabinet.svg" alt="Kommode" width="200" height="200">
                <img src="img/dresser.svg" alt="Kommode mit Schubladen" width="200" height="200">
            </div>
        </details>
    </div>
    <div class="product-categories">
        <details class="dropdown">
            <summary>Tische</summary>
            <div class="dropdown-content">
                <img src="img/table.svg" alt="Schreibtisch" width="200" height="200">
                <img src="img/desk.svg" alt="Schreibtisch mit Unterschrank" width="500" height="500">
            </div>
        </details>
    </div>
    <div class="product-categories">
        <details class="dropdown">
            <summary>Stühle</summary>
            <div class="dropdown-content">
                <img src="img/cupboard.svg" alt="Schrank" width="500" height="500">
                <img src="img/filing-cabinet.svg" alt="Aktenschrank" width="200" height="200">
            </div>
        </details>
    </div>
    <div class="product-categories">
        <details class="dropdown">
            <summary>Diverses</summary>
            <div class="dropdown-content">
                <img src="img/bed-modern.svg" alt="Modernes Bett für 2 Personen" width="500" height="500">
                <img src="img/chair.svg" alt="Stuhl aus Vollholz" width="500" height="500">
            </div>
        </details>
    </div>
</body>
</html>
